# Sidelink settings for this PC. Edit, then run stop.sh and start.sh again.
# PC-B (192.0.2.95): nearby UE, sidelink address 10.0.0.2
ROLE=b                # a = SyncRef (PC-A), b = nearby UE (PC-B). Do not change.
PEER_LAN_IP=192.0.2.72    # Jetson (role a) - Jetson<->PC pairing

# Frequency: n47   = 5910 MHz (V2X/ITS band n47). Only inside the Faraday cage.
#            20mhz = 2585.1 MHz (the authorized over-the-air frequency).
#            cbrs  = 3625.0 MHz (CBRS band n48). Only inside the Faraday cage.
# One run can also override it:  ./start.sh 20mhz
PROFILE=cbrs

# Radio settings that tested clean (0 decode errors) on 2026-10-27/29.
TXGAIN=15               # 0 = max TX power (89.75 dB). Higher = more attenuation.
RXGAIN=110             # 110 = 60 dB RX gain at 2.6 GHz.
TA=128                 # TX timing advance in samples (PC-B needs 128, window ~100-160).
MAXMCS=2               # MCS cap. Keep low: decoding at MCS >= 19 silently fails on this OAI branch.

# Reliability
RATE_LIMIT=     # Cap traffic sent into the link (empty = no cap). Above ~300 kbit/s the link corrupts itself.
AUTO_RESTART=1         # 1 = restart the modem automatically when it exits/crashes.
WATCHDOG_SECS=120      # Restart the modem if the peer stops answering for this long after the link was up (0 = off).
RX_TO_TX=6            # RX->TX slot offset (4..12; 4 = OAI default). Need NOT match the peer. Jetson needs 12 (slow TX slot build), PC 6.
