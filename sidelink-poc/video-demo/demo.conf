# Settings for run-demo.sh (same file on both machines).

# Frequency profile of the sidelink kit:  cbrs = 3625 MHz (band n48)   20mhz = 2585.1 MHz   n47 = 5910 MHz
# 2585.1 MHz may be in use by other groups in your lab - check before using 20mhz.
PROFILE=cbrs

# ---- Automatic MCS / bitrate (sender side) -------------------------------------------------------------
# 1 = adapt, searching from the top: the sender starts at START_MCS (the highest level) and drops one level
#     each time the receiver reports more than TARGET_LOSS % of frames lost in LOSS_WINDOW seconds, until a
#     level holds a clean window. After any later failure, and after each clean window, it goes back to the
#     highest level that is not waiting out a failure and drops again from there. A level that fails as
#     soon as it is tried is not tried again for FIRST_RETRY_WAIT seconds, then twice as long each time, up
#     to MAX_RETRY_WAIT; one that had held a clean window before failing, for LOSS_WINDOW seconds.
#     Each new level is first tried at the lowest bitrate for about a second, so a level that does not
#     decode costs little.
# 0 = fixed: stream CLIP at SENDER_MAXMCS, as in the first version of the demo.
ADAPT=1
LADDER=clips/ladder-siren      # one encoding of the clip per MCS, made on the PC by tools/make-ladder.sh
                               # (also there: clips/ladder-testvideo, the 1080p50 test video at 480p)
MIN_MCS=0
MAX_MCS=22               # the top of the ladder. On 14 Nov 2026 MCS 0-19 carried video cleanly; MCS 20 and
                         # above lost blocks (signal quality), so the search has a real ceiling to find.
START_MCS=22             # where the sender starts: normally the same as MAX_MCS
TX_SLOT_LIMIT=240        # most transmissions per second the Jetson's modem may make (it has 400 slots, but
                         # falls behind the radio above about 250 and then the whole link collapses)
TARGET_LOSS=1            # percent of frames
LOSS_WINDOW=10           # seconds
FIRST_RETRY_WAIT=30      # seconds
MAX_RETRY_WAIT=300       # seconds

# Radio settings the demo was measured with. run-demo.sh writes them into ~/Desktop/sidelink/settings.conf
# when they differ (the previous file is copied to backups/ first).
SENDER_MAXMCS=9          # Jetson: MCS at modem start and in fixed mode (ADAPT=1 then sets the MCS while running)
SENDER_RX_TO_TX=12       # Jetson: slots of lead between receiving and transmitting (it needs ~0.9 ms per TX slot)
RECEIVER_MAXMCS=2        # PC: it only sends acknowledgements; keep that light for the Jetson to decode
RECEIVER_RX_TO_TX=6

# Clip for the fixed mode (ADAPT=0), relative to this folder. Must be an ordinary MP4 with H.264 video and no
# B-frames; frequent keyframes limit the damage of a lost frame. tools/prepare-clip.sh makes one with ffmpeg.
CLIP=clips/siren_480p_stream.mp4

# 1 = also show the clip on the Jetson's own screen. Off by default: decoding and drawing video on the
# Jetson takes CPU time from the modem, which has none to spare.
LOCAL_DISPLAY=0

# CPUs for the sender process on the Jetson (CPU 0 is left for the USRP USB interrupts).
SENDER_CPUS=1-5

# 1 = turn the radio off when the demo stops (recommended: frees the frequency). 0 = leave the link running.
STOP_RADIO_ON_EXIT=1
